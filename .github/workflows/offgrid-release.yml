name: Offgrid release

# Builds unsigned installers on GitHub-hosted runners and attaches them to the release for the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.12"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: offgrid-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Offgrid ${TAG#v}" --notes ""

  build:
    name: Build ${{ matrix.label }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          - label: macOS Apple Silicon
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS Intel
            runner: macos-26
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Build installer
        shell: bash
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${TAG#v}" \
            --output-dir release-out

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release-out/*.exe release-out/*.dmg release-out/*.AppImage release-out/*.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The build produced no installer."
            ls -la release-out
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  packages:
    name: Flatpak and AUR
    needs: build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/offgrid-packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
